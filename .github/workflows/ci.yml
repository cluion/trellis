name: Verify changes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Squash 合併時 PR 標題會成為 main 上的 commit 標題，所以一併檢查。
      - name: Verify English commit subjects
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if printf '%s' "$PR_TITLE" | LC_ALL=C grep -q '[^ -~]'; then
            echo "Pull request titles must use English ASCII text: $PR_TITLE" >&2
            exit 1
          fi
          base_sha="$PR_BASE_SHA"
          if test -z "$base_sha"; then
            base_sha="$(git merge-base origin/main "$HEAD_SHA")"
          fi
          ./docker/operations/verify-commit-subjects.sh "$base_sha" "$HEAD_SHA"

  verify:
    needs: commit-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Docker environment
        run: |
          cp docker/.env.example docker/.env
          sed -i "s/^PUID=.*/PUID=$(id -u)/" docker/.env
          sed -i "s/^PGID=.*/PGID=$(id -g)/" docker/.env

      - name: Build the toolchain image
        run: make build

      - name: Install dependencies
        run: docker compose --env-file docker/.env -f docker/compose.yaml run --rm app pnpm install --frozen-lockfile

      - name: Run verification gates
        run: |
          make audit
          make secret-scan
          make ci

  vue-server-side:
    name: Vue browser tests (${{ matrix.packages }})
    needs: commit-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        packages: [checkout, published]
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --init --ipc=host
    env:
      TRELLIS_E2E_PACKAGES: ${{ matrix.packages }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        if: matrix.packages == 'checkout'

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: tests/e2e/vue-server-side/package-lock.json

      - name: Build current checkout
        if: matrix.packages == 'checkout'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 此 fixture 刻意不加入 pnpm workspace，published 模式只解析公開 npm 套件。
      - name: Install isolated browser fixture
        run: npm ci --prefix tests/e2e/vue-server-side

      - name: Check browser test types
        run: npm --prefix tests/e2e/vue-server-side run typecheck

      - name: Run Chromium, Firefox and WebKit
        run: npm run test:e2e:vue
        env:
          # GitHub 掛載的 /github/home 屬於 host UID；Firefox 的 root 行程需使用 root 家目錄。
          HOME: /root

      - name: Upload browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vue-server-side-${{ matrix.packages }}
          path: |
            tests/e2e/vue-server-side/playwright-report/
            tests/e2e/vue-server-side/test-results/
          retention-days: 14
          if-no-files-found: ignore

  prisma7:
    name: Prisma 7 (${{ matrix.provider }})
    needs: commit-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: mysql
            image: mysql:8.4.11
            port: 3306
            url: mysql://trellis:trellis-test@127.0.0.1:3306/trellis_prisma7_test
            health: mysqladmin ping -h 127.0.0.1 -uroot -ptrellis-root-test --silent
          - provider: postgresql
            image: postgres:18.6-bookworm
            port: 5432
            url: postgresql://trellis:trellis-test@127.0.0.1:5432/trellis_prisma7_test
            health: pg_isready -h 127.0.0.1 -U trellis -d trellis_prisma7_test
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: trellis-root-test
          MYSQL_DATABASE: trellis_prisma7_test
          MYSQL_USER: trellis
          MYSQL_PASSWORD: trellis-test
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis-test
          POSTGRES_DB: trellis_prisma7_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=2s --health-timeout=3s --health-retries=60
    env:
      TRELLIS_TEST_PROVIDER: ${{ matrix.provider }}
      TRELLIS_TEST_DATABASE_URL: ${{ matrix.url }}
      PRISMA_SKIP_POSTINSTALL_GENERATE: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: tests/integration/prisma7/package-lock.json

      - name: Build adapter and response validator
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --filter @trellisjs/server-prisma... --filter @trellisjs/plugin-datasource... run build

      - name: Install pinned Prisma 7 fixture
        run: npm ci --prefix tests/integration/prisma7

      - name: Generate client and initialize disposable schema
        working-directory: tests/integration/prisma7
        run: |
          npm run generate
          npm run db:push
          npm run typecheck

      - name: Test real database queries and concurrent writes
        run: npm --prefix tests/integration/prisma7 test

      - name: Upload database test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma7-${{ matrix.provider }}
          path: tests/integration/prisma7/reports/
          retention-days: 14
          if-no-files-found: ignore
