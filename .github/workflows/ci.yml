name: Verify changes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Squash 合併時 PR 標題會成為 main 上的 commit 標題，所以一併檢查。
      - name: Verify English commit subjects
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if printf '%s' "$PR_TITLE" | LC_ALL=C grep -q '[^ -~]'; then
            echo "Pull request titles must use English ASCII text: $PR_TITLE" >&2
            exit 1
          fi
          base_sha="$PR_BASE_SHA"
          if test -z "$base_sha"; then
            base_sha="$(git merge-base origin/main "$HEAD_SHA")"
          fi
          ./docker/operations/verify-commit-subjects.sh "$base_sha" "$HEAD_SHA"

  verify:
    needs: commit-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Docker environment
        run: |
          cp docker/.env.example docker/.env
          sed -i "s/^PUID=.*/PUID=$(id -u)/" docker/.env
          sed -i "s/^PGID=.*/PGID=$(id -g)/" docker/.env

      - name: Build the toolchain image
        run: make build

      - name: Install dependencies
        run: docker compose --env-file docker/.env -f docker/compose.yaml run --rm app pnpm install --frozen-lockfile

      - name: Run verification gates
        run: |
          make audit
          make secret-scan
          make ci

  vue-server-side:
    name: Vue browser tests (${{ matrix.packages }})
    needs: commit-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        packages: [checkout, published]
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --init --ipc=host
    env:
      TRELLIS_E2E_PACKAGES: ${{ matrix.packages }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        if: matrix.packages == 'checkout'

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: tests/e2e/vue-server-side/package-lock.json

      - name: Build current checkout
        if: matrix.packages == 'checkout'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 此 fixture 刻意不加入 pnpm workspace，published 模式只解析公開 npm 套件。
      - name: Install isolated browser fixture
        run: npm ci --prefix tests/e2e/vue-server-side

      - name: Check browser test types
        run: npm --prefix tests/e2e/vue-server-side run typecheck

      - name: Run Chromium, Firefox and WebKit
        run: npm run test:e2e:vue

      - name: Upload browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vue-server-side-${{ matrix.packages }}
          path: |
            tests/e2e/vue-server-side/playwright-report/
            tests/e2e/vue-server-side/test-results/
          retention-days: 14
          if-no-files-found: ignore
